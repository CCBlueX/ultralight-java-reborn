name: Natives

on:
  workflow_call:
    inputs:
      ident:
        type: string
        required: true
      runner:
        type: string
        required: true
      cmake-args:
        type: string
        default: ''

env:
  ULTRALIGHT_VERSION: 1.4.0
  # The Ultralight SDK can't be redistributed, so it comes from our own storage
  RESOURCE_API: https://api.liquidbounce.net/api/v3/resource

jobs:
  natives:
    name: ${{ inputs.ident }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Download the Ultralight SDK
        run: .github/scripts/download-ultralight.sh ultralight-sdk ${{ inputs.ident }} .ultralight/sdk.7z

      - name: Build the natives and run the smoke test
        run: |
          # Java and CMake on Windows need Windows paths
          root=$(pwd -W 2>/dev/null || pwd)
          ./gradlew \
            "-Pujr.ultralightSdk=$root/.ultralight/sdk.7z" \
            "-Pujr.cmakeArgs=${{ inputs.cmake-args }}" \
            "-Pujr.prebuiltNativesDir=$root/build/prebuilt-natives" \
            "-Pujr.ultralightDirectory=$root/modules/platform-jni/build/native/cmake/ultralight-${{ inputs.ident }}" \
            -Pujr.nativeReleaseBuild=true \
            :modules:ultralight-java-reborn-platform-jni:exportPrebuiltNatives \
            :examples:ultralight-java-reborn-example-smoke:run

      - name: Show the linked libraries
        run: |
          library=$(find modules/platform-jni/build/native/prefix -name '*ultralight-java-reborn*' -type f | head -n1)
          case "${{ inputs.ident }}" in
            linux-*) ldd "$library" || true ;;
            mac-*) otool -L "$library" ;;
            win-*) objdump -p "$library" | grep 'DLL Name' || true ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ inputs.ident }}
          path: build/prebuilt-natives/
          retention-days: 3
          if-no-files-found: error
